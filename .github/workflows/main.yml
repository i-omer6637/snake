name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Upstream Platane/snk reads the contribution calendar via GitHub's GraphQL API,
# which now fails with "Resource limits for this query exceeded" and cannot be
# fixed caller-side. This workflow instead runs src/build-snake.ts, which reads
# the same calendar from the public (token-free) HTML endpoint and feeds it into
# snk's own solver + SVG renderer. snk is pinned so an upstream change can't
# silently break the build.
env:
  SNK_REF: a041d6c27ba561a39f5be9c26a784812765e434b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build snk + generate snake
        env:
          USER_NAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git clone https://github.com/Platane/snk.git snk
          cd snk
          git checkout "$SNK_REF"
          bun install --frozen-lockfile
          cp "$GITHUB_WORKSPACE/src/build-snake.ts" .
          bun build-snake.ts \
            --github_user="$USER_NAME" \
            --output="$GITHUB_WORKSPACE/dist/github-snake.svg" \
            --output="$GITHUB_WORKSPACE/dist/github-snake-dark.svg?palette=github-dark" \
            --output="$GITHUB_WORKSPACE/dist/ocean.svg?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9"

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
